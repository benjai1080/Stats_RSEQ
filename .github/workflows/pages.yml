# Publie le site (docs/) sur GitHub Pages : https://benjai1080.github.io/Stats_RSEQ/
# Réglage à faire une fois : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
# Se lance quand docs/ change sur main, à la main (onglet Actions), ou depuis « Mise à jour du site »
# (un commit fait par une action ne relance pas les autres workflows : celui-ci est donc appelé).
name: Publier le site

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publier docs/ sur GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # appelé après un commit de la mise à jour : prendre le main à jour
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
